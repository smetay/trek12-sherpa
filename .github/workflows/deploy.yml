name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build for Pages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build web app
        run: pnpm build
        env:
          # e.g. "/trek12-sherpa" + "/" — keeps the Vite base in sync with the Pages URL.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
